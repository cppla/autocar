version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /third_party/hysteria-core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      hardened-core-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /third_party/quic-go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      hardened-quic-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - github/codeql-action/*
      codeql-actions:
        patterns:
          - github/codeql-action/*

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
