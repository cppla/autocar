name: Linux netem integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iptables ethtool tcpdump curl
          sudo update-alternatives --set iptables /usr/sbin/iptables-nft
          iptables --version | grep -F '(nf_tables)'
      - name: Build
        run: make build
      - name: Run namespace and netem suite
        run: sudo env AUTOCAR_ARTIFACT_DIR="$PWD/artifacts/netem" ./scripts/netem-integration.sh "$PWD/bin/autocar"
      - name: Publish measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netem-results
          path: artifacts/netem
          if-no-files-found: warn
