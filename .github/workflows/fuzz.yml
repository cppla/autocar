name: Scheduled fuzzing

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  # Preserve a crashing input until the failure artifact step can upload it.
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/datagram
            target: FuzzParse
          - package: ./internal/datagram
            target: FuzzEncodeParseReassemble
          - package: ./internal/protocol
            target: FuzzReadRequest
          - package: ./internal/proxy
            target: FuzzParseSOCKSUDPDatagram
          - package: ./internal/proxy
            target: FuzzReadSOCKSGreeting
          - package: ./internal/proxy
            target: FuzzReadSOCKSRequest
          - package: ./internal/proxy
            target: FuzzParseProxyBasicAuth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - name: Fuzz ${{ matrix.target }}
        run: >-
          go test "${{ matrix.package }}"
          -run '^$'
          -fuzz '^${{ matrix.target }}$'
          -fuzztime 2m
          -timeout 5m
          -parallel 2
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-crashers
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}
          if-no-files-found: ignore
