name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet and test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.13', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting
        if: matrix.go == '1.27.x'
        run: make fmt-check
      - name: Verify dependency boundary
        if: matrix.go == '1.27.x'
        run: make dependency-boundary-check
      - name: Verify module files
        if: matrix.go == '1.27.x'
        run: make mod-check
      - name: Verify third-party notices
        if: matrix.go == '1.27.x'
        run: make notices-check
      - name: Vet
        run: make vet
      - name: Release contract regression tests
        if: matrix.go == '1.27.x'
        run: make release-recipe-check
      - name: Test with coverage
        run: go test -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error

  macos-test:
    name: macOS test (Go 1.25.13)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: true
      - name: Test
        run: go test -shuffle=on -count=1 ./...

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - run: make race

  vulnerability-scan:
    name: Reachable vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.13
          cache: true
      - name: Run govulncheck
        run: ./scripts/govulncheck.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: autocar-linux-amd64
            binary: autocar
            archive: autocar-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            artifact: autocar-linux-arm64
            binary: autocar
            archive: autocar-linux-arm64.tar.gz
          - goos: darwin
            goarch: arm64
            artifact: autocar-darwin-arm64
            binary: autocar
            archive: autocar-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            artifact: autocar-windows-amd64
            binary: autocar.exe
            archive: autocar-windows-amd64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true
      - name: Cross-build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/package
          BUILD_VERSION="ci-${GITHUB_SHA:0:12}"
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/cppla/autocar/internal/version.Version=${BUILD_VERSION} -X github.com/cppla/autocar/internal/version.Commit=${GITHUB_SHA} -X github.com/cppla/autocar/internal/version.Date=${BUILD_DATE}" \
            -o "dist/package/${{ matrix.binary }}" ./cmd/autocar
          cp LICENSE THIRD_PARTY_NOTICES.md dist/package/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist/package && zip -q -X "../${{ matrix.archive }}" "${{ matrix.binary }}" LICENSE THIRD_PARTY_NOTICES.md)
          else
            tar -C dist/package -czf "dist/${{ matrix.archive }}" "${{ matrix.binary }}" LICENSE THIRD_PARTY_NOTICES.md
          fi
          test -s "dist/${{ matrix.archive }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  container:
    name: Multi-platform container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run container integration
        run: make integration-docker
      - name: Build OCI image index
        run: |
          docker buildx create --name autocar-ci --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output type=oci,dest=/tmp/autocar-images.tar \
            .
